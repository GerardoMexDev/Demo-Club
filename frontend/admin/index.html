<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — PULSO Club Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">

<body class="pantalla">
  <div id="nav-admin" class="nav-admin"></div>

  <main class="container" style="padding-top: var(--esp-xl);">
    <h1>Dashboard</h1>
    <p>Resumen de la actividad de hoy en el club.</p>

    <section class="grid-cards" id="cards-resumen" aria-label="Resumen del día">
      <div class="card card-resumen"><div class="skeleton" style="height:64px"></div></div>
      <div class="card card-resumen"><div class="skeleton" style="height:64px"></div></div>
      <div class="card card-resumen"><div class="skeleton" style="height:64px"></div></div>
      <div class="card card-resumen"><div class="skeleton" style="height:64px"></div></div>
    </section>

    <div class="flex items-center justify-between" style="margin-top: var(--esp-2xl);">
      <h2>Clases de hoy</h2>
      <a href="/admin/horarios.html" class="btn btn-secundario btn-sm">Ir a horarios</a>
    </div>
    <div id="lista-clases-hoy" class="flex-col gap-md" style="margin-top: var(--esp-md);">
      <div class="card"><div class="skeleton" style="height:48px"></div></div>
    </div>
  </main>

  <script type="module" src="/admin/js/dashboard.js"></script>

</html>
