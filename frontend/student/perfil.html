<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — Club Solis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<style>
  body { padding-bottom: calc(var(--nav-inferior-alto) + var(--esp-lg)); max-width: 560px; margin: 0 auto; }
  .contenido-perfil { padding: 0 var(--esp-md); display: flex; flex-direction: column; gap: var(--esp-md); }
  .avatar-perfil {
    width: 72px; height: 72px; border-radius: var(--radio-full);
    background: var(--color-primario); color: var(--color-primario-texto);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--fuente-titulos); font-size: 1.75rem; font-weight: 700;
    margin: 0 auto var(--esp-sm);
  }
  .fila-dato { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--color-borde); }
  .fila-dato:last-child { border-bottom: none; }
</style>
</head>
<body>
  <header class="header-simple">
    <h1>Perfil</h1>
  </header>

  <main class="contenido-perfil">
    <div class="card" style="text-align:center;">
      <div class="avatar-perfil" id="avatar-perfil">?</div>
      <h3 id="nombre-perfil">—</h3>
      <p class="texto-small">Alumno de Club Solis</p>
    </div>

    <div class="card">
      <div class="fila-dato"><span class="texto-small">Teléfono</span><span id="telefono-perfil">—</span></div>
      <div class="fila-dato"><span class="texto-small">Rol</span><span>Alumno</span></div>
    </div>

    <button class="btn btn-secundario btn-bloque" id="btn-cerrar-sesion">Cerrar sesión</button>
  </main>

  <nav class="nav-inferior" id="nav-inferior"></nav>

  <script type="module" src="/student/js/perfil.js"></script>
</body>
</html>
