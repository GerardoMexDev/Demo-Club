<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorar — Club Solis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<style>
  body { padding-bottom: calc(var(--nav-inferior-alto) + var(--esp-lg)); max-width: 560px; margin: 0 auto; }
  .filtro-chips { display: flex; gap: var(--esp-sm); overflow-x: auto; padding: 0 var(--esp-md) var(--esp-md); }
  .filtro-chips button {
    flex-shrink: 0; border: 1px solid var(--color-borde); background: var(--color-fondo-alt); color: var(--color-texto-suave);
    border-radius: var(--radio-full); padding: 8px 16px; font-size: var(--texto-small); font-weight: 600; cursor: pointer;
    transition: background var(--dur-rapido) var(--curva), color var(--dur-rapido) var(--curva), border-color var(--dur-rapido) var(--curva);
  }
  .filtro-chips button.activo { background: var(--color-primario); color: var(--color-primario-texto); border-color: var(--color-primario); }
  .lista-explorar { padding: 0 var(--esp-md); display: flex; flex-direction: column; gap: var(--esp-lg); }
  .dia-titulo { font-size: var(--texto-small); text-transform: uppercase; letter-spacing: .06em; color: var(--color-texto-suave); margin: 0 0 var(--esp-sm); }
  .clase-card { display: flex; flex-direction: column; gap: var(--esp-sm); }
  .clase-card-top { display: flex; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
  <header class="header-simple">
    <h1>Explorar</h1>
    <p>Encontrá tu próxima clase en Club Solis.</p>
  </header>

  <div class="filtro-chips" id="filtro-disciplina-chips">
    <button data-disciplina="" class="activo">Todas</button>
  </div>

  <main class="lista-explorar" id="lista-explorar">
    <div class="card"><div class="skeleton" style="height:90px"></div></div>
  </main>

  <nav class="nav-inferior" id="nav-inferior"></nav>

  <script type="module" src="/student/js/explorar.js"></script>
</body>
</html>
